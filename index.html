<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Attendance Tracker</title>
    
    <!-- 1. The Magic Styling Tool: Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. The Beautiful Font: Google Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* This tells the app to use our beautiful font everywhere */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6; /* A very soft, modern light gray background */
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen pt-10 px-4">
    
    <!-- The Main App Container (Designed to look like a sleek phone app) -->
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <!-- DASHBOARD SECTION -->
        <!-- We use a beautiful purple-to-indigo gradient here -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-8 text-white text-center rounded-b-[2.5rem] shadow-lg">
            <p class="text-sm font-semibold uppercase tracking-wider opacity-80 mb-1">Current Voucher</p>
            <h2 class="text-xl font-bold mb-6" id="voucher-date-range">July 20 - August 19</h2>
            
            <!-- The Big Bold Number -->
            <div class="flex justify-center items-baseline space-x-2">
                <span class="text-7xl font-bold tracking-tight" id="days-present-count">21</span>
                <span class="text-lg font-medium opacity-90">Days</span>
            </div>
            <p class="mt-2 text-indigo-100 font-medium tracking-wide">Total Days Present</p>
        </div>

        <!-- STATS ROW SECTION -->
        <div class="flex justify-around items-center p-6 border-b border-gray-100 bg-gray-50">
            <div class="text-center">
                <p class="text-3xl font-bold text-red-500" id="days-missed-count">1</p>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Missed</p>
            </div>
            <div class="w-px h-10 bg-gray-200"></div> <!-- This is a tiny grey line divider -->
            <div class="text-center">
                <p class="text-3xl font-bold text-gray-400" id="days-off-count">8</p>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Days Off</p>
            </div>
        </div>

        <!-- CALENDAR SECTION -->
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800">Attendance Grid</h3>
                <!-- The button to set the 2-2-2 cycle -->
                <button id="set-cycle-btn" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-full hover:bg-indigo-100 transition shadow-sm border border-indigo-100">
                    Set Cycle Start
                </button>
            </div>
            
            <!-- We will put our beautiful calendar grid here in Phase 2 -->
            <div id="calendar-grid" class="bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl p-10 text-center text-gray-400 font-medium">
                Calendar Grid will magically appear here!
            </div>
        </div>
        
    </div>

    <!-- PHASE 4: THE FINAL MASTER JAVASCRIPT -->
    <script>
        // 1. App Memory (Now remembers Anchor Date AND Missed Days)
        let savedAnchorDate = localStorage.getItem('anchorDate') || null;
        // We use JSON.parse to turn the saved text back into a real JavaScript list (array)
        let missedDays = JSON.parse(localStorage.getItem('missedDays')) || []; 
        let isSettingCycle = false; 

        // 2. Calculate the Voucher Period
        function getVoucherPeriod() {
            const today = new Date();
            let startMonth = today.getMonth();
            let startYear = today.getFullYear();

            if (today.getDate() < 20) {
                startMonth -= 1;
                if (startMonth < 0) {
                    startMonth = 11;
                    startYear -= 1;
                }
            }
            const startDate = new Date(startYear, startMonth, 20);
            
            let endMonth = startMonth + 1;
            let endYear = startYear;
            if (endMonth > 11) {
                endMonth = 0;
                endYear += 1;
            }
            const endDate = new Date(endYear, endMonth, 19);

            return { startDate, endDate };
        }

        // 3. Update the Dashboard Text
        function updateDashboardText(start, end) {
            const options = { month: 'short', day: 'numeric' };
            document.getElementById('voucher-date-range').innerText = 
                `${start.toLocaleDateString('en-US', options)} - ${end.toLocaleDateString('en-US', options)}`;
        }

        // 4. The 2-2-2 Math Engine
        function getShiftInfo(targetDate) {
            if (!savedAnchorDate) return null; 

            const dateParts = savedAnchorDate.split('-');
            const anchor = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
            
            const d1 = Date.UTC(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
            const d2 = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            
            const diffDays = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
            const cycleDay = ((diffDays % 6) + 6) % 6; 
            
            if (cycleDay === 0 || cycleDay === 1) return { label: 'M', color: 'bg-yellow-50 text-yellow-700 border-yellow-200' };
            if (cycleDay === 2 || cycleDay === 3) return { label: 'N', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' };
            if (cycleDay === 4 || cycleDay === 5) return { label: 'OFF', color: 'bg-gray-100 text-gray-400 border-gray-200 opacity-60' };
        }

        // 5. The Engine that runs the App
        function renderCalendar() {
            const { startDate, endDate } = getVoucherPeriod();
            updateDashboardText(startDate, endDate);

            const gridContainer = document.getElementById('calendar-grid');
            gridContainer.className = "grid grid-cols-7 gap-2 sm:gap-3 mt-4";
            gridContainer.innerHTML = ""; 

            let currentDate = new Date(startDate);
            
            // Dashboard Trackers
            let presentCount = 0;
            let missedCount = 0;
            let offCount = 0;

            // Loop through every day of the voucher
            while (currentDate <= endDate) {
                const dayOfMonth = currentDate.getDate();
                const y = currentDate.getFullYear();
                const m = String(currentDate.getMonth() + 1).padStart(2, '0');
                const d = String(currentDate.getDate()).padStart(2, '0');
                const fullDateString = `${y}-${m}-${d}`; 
                
                const dayBtn = document.createElement('button');
                dayBtn.className = "aspect-square flex flex-col items-center justify-center rounded-xl bg-white border border-gray-200 shadow-sm transition font-bold text-lg sm:text-xl relative overflow-hidden";
                
                const shiftInfo = getShiftInfo(currentDate);

                if (shiftInfo) {
                    // Check if this day is on the "Missed" list
                    const isMissed = missedDays.includes(fullDateString);

                    if (shiftInfo.label === 'OFF') {
                        offCount++; // Count days off
                        dayBtn.className = `aspect-square flex flex-col items-center justify-center rounded-xl border shadow-sm transition font-bold text-lg sm:text-xl relative ${shiftInfo.color}`;
                        dayBtn.innerHTML = `<span>${dayOfMonth}</span><span class="text-[0.6rem] font-bold uppercase tracking-widest mt-1 opacity-80">OFF</span>`;
                    
                    } else if (isMissed) {
                        missedCount++; // Count missed days
                        // The striking Crimson Red styling for missed days
                        dayBtn.className = "aspect-square flex flex-col items-center justify-center rounded-xl border shadow-md transition font-bold text-lg sm:text-xl relative bg-red-500 text-white border-red-600 scale-95";
                        dayBtn.innerHTML = `<span>${dayOfMonth}</span><span class="text-[0.55rem] font-bold uppercase tracking-widest mt-1 opacity-90">MISSED</span>`;
                    
                    } else {
                        presentCount++; // Count present days
                        // Normal Morning / Night styling
                        dayBtn.className = `aspect-square flex flex-col items-center justify-center rounded-xl border shadow-sm hover:shadow-md transition font-bold text-lg sm:text-xl relative ${shiftInfo.color}`;
                        dayBtn.innerHTML = `<span>${dayOfMonth}</span><span class="text-[0.6rem] font-bold uppercase tracking-widest mt-1 opacity-80">${shiftInfo.label}</span>`;
                    }
                } else {
                    // This only shows if no cycle is set yet
                    dayBtn.innerText = dayOfMonth;
                }

                // What happens when you click a day?
                dayBtn.onclick = function() {
                    if (isSettingCycle) {
                        localStorage.setItem('anchorDate', fullDateString);
                        savedAnchorDate = fullDateString;
                        isSettingCycle = false; 
                        
                        document.getElementById('set-cycle-btn').innerText = "Change Cycle Start";
                        document.getElementById('set-cycle-btn').classList.remove('animate-pulse', 'bg-red-100', 'text-red-600');
                        
                        renderCalendar(); 
                    } else {
                        // THE TOGGLE LOGIC
                        if (!shiftInfo) {
                            alert("Please set your Cycle Start day first!");
                            return;
                        }
                        if (shiftInfo.label === 'OFF') return; // Do nothing if it's an off day

                        // If it's already missed, remove it. If not, add it!
                        if (missedDays.includes(fullDateString)) {
                            missedDays = missedDays.filter(day => day !== fullDateString);
                        } else {
                            missedDays.push(fullDateString);
                        }
                        
                        // Save the updated list to Memory
                        localStorage.setItem('missedDays', JSON.stringify(missedDays));
                        
                        // Redraw the calendar instantly to update colors and numbers!
                        renderCalendar();
                    }
                };

                gridContainer.appendChild(dayBtn);
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // 6. Update the Big Bold Numbers on the Dashboard!
            if (savedAnchorDate) {
                document.getElementById('days-present-count').innerText = presentCount;
                document.getElementById('days-missed-count').innerText = missedCount;
                document.getElementById('days-off-count').innerText = offCount;
            } else {
                // If they haven't set a cycle yet, show dashes
                document.getElementById('days-present-count').innerText = "--";
                document.getElementById('days-missed-count').innerText = "--";
                document.getElementById('days-off-count').innerText = "--";
            }
        }

        // 7. Setup the Cycle Button
        const setCycleBtn = document.getElementById('set-cycle-btn');
        if (savedAnchorDate) setCycleBtn.innerText = "Change Cycle Start";
        
        setCycleBtn.onclick = function() {
            isSettingCycle = true;
            this.innerText = "Select Day Below...";
            this.classList.add('animate-pulse', 'bg-red-100', 'text-red-600'); 
        };

        // 8. Start the App!
        renderCalendar();
    </script>
</body>
</html>
