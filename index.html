<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Attendance Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen pt-10 px-4">
    
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        
        <!-- DASHBOARD SECTION -->
        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-8 text-white text-center rounded-b-[2.5rem] shadow-lg">
            <p class="text-sm font-semibold uppercase tracking-wider opacity-80 mb-1">Voucher Period</p>
            
            <div class="flex items-center justify-center gap-3">
                <button id="prev-period-btn" class="text-white/60 hover:text-white transition text-2xl leading-none font-bold" title="Previous period">&larr;</button>
                <h2 class="text-xl font-bold" id="voucher-date-range">July 20 - August 19</h2>
                <button id="next-period-btn" class="text-white/60 hover:text-white transition text-2xl leading-none font-bold" title="Next period">&rarr;</button>
            </div>
            
            <p class="text-xs font-medium uppercase tracking-wider mt-1 opacity-60" id="period-label">Current Period</p>
            
            <div class="flex justify-center items-baseline space-x-2 mt-5">
                <span class="text-7xl font-bold tracking-tight" id="days-present-count">--</span>
                <span class="text-lg font-medium opacity-90">Days</span>
            </div>
            <p class="mt-2 text-indigo-100 font-medium tracking-wide">Total Days Present</p>
        </div>

        <!-- STATS ROW -->
        <div class="flex justify-around items-center p-6 border-b border-gray-100 bg-gray-50">
            <div class="text-center">
                <p class="text-3xl font-bold text-red-500" id="days-missed-count">--</p>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Missed</p>
            </div>
            <div class="w-px h-10 bg-gray-200"></div>
            <div class="text-center">
                <p class="text-3xl font-bold text-gray-400" id="days-off-count">--</p>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Days Off</p>
            </div>
        </div>

        <!-- CALENDAR SECTION -->
        <div class="p-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-bold text-gray-800">Attendance Grid</h3>
                <button id="set-cycle-btn" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-2 rounded-full hover:bg-indigo-100 transition shadow-sm border border-indigo-100">
                    Set Cycle Start
                </button>
            </div>
            
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-1.5">
            </div>
        </div>
        
        <!-- EXPORT / IMPORT / RESET SECTION -->
        <div class="p-5 border-t border-gray-100 bg-gray-50 flex flex-col items-center gap-3">
            <div class="flex gap-2 justify-center">
                <button id="export-btn" class="text-xs font-semibold text-indigo-600 bg-white px-4 py-2 rounded-full hover:bg-indigo-50 transition shadow-sm border border-indigo-200">
                    Export Data
                </button>
                <button id="import-btn" class="text-xs font-semibold text-indigo-600 bg-white px-4 py-2 rounded-full hover:bg-indigo-50 transition shadow-sm border border-indigo-200">
                    Import Data
                </button>
                <button id="reset-btn" class="text-xs font-semibold text-red-500 bg-white px-4 py-2 rounded-full hover:bg-red-50 transition shadow-sm border border-red-200">
                    Reset All
                </button>
            </div>
            <p class="text-[0.6rem] text-gray-400 text-center">Your data stays on your device. Use Export to back it up.</p>
            <input type="file" id="import-file-input" accept=".json" class="hidden">
        </div>
        
    </div>

    <script>
        // ── STATE ──
        let savedAnchorDate = localStorage.getItem('anchorDate') || null;
        let missedDays = JSON.parse(localStorage.getItem('missedDays')) || [];
        let isSettingCycle = false;
        let periodOffset = 0;

        const WEEKDAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

        // ── PERIOD MATH ──
        function getVoucherPeriod(offset = 0) {
            const today = new Date();
            let baseMonth = today.getMonth();
            let baseYear = today.getFullYear();

            if (today.getDate() < 20) {
                baseMonth -= 1;
                if (baseMonth < 0) {
                    baseMonth = 11;
                    baseYear -= 1;
                }
            }

            baseMonth += offset;
            baseYear += Math.floor(baseMonth / 12);
            baseMonth = ((baseMonth % 12) + 12) % 12;

            const startDate = new Date(baseYear, baseMonth, 20);
            let endMonth = baseMonth + 1;
            let endYear = baseYear;
            if (endMonth > 11) {
                endMonth = 0;
                endYear += 1;
            }
            const endDate = new Date(endYear, endMonth, 19);

            return { startDate, endDate };
        }

        function getPeriodLabel(offset) {
            if (offset === 0) return 'Current Period';
            if (offset === -1) return 'Previous Period';
            if (offset === 1) return 'Next Period';
            return offset < 0 ? `${Math.abs(offset)} Periods Ago` : `${offset} Periods Ahead`;
        }

        // ── DASHBOARD HEADER ──
        function updateDashboardHeader(startDate, endDate) {
            const options = { month: 'short', day: 'numeric' };
            document.getElementById('voucher-date-range').innerText =
                `${startDate.toLocaleDateString('en-US', options)} - ${endDate.toLocaleDateString('en-US', options)}`;
            document.getElementById('period-label').innerText = getPeriodLabel(periodOffset);
        }

        // ── 2-2-2 SHIFT ENGINE ──
        function getShiftInfo(targetDate) {
            if (!savedAnchorDate) return null;

            const dateParts = savedAnchorDate.split('-');
            const anchor = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);

            const d1 = Date.UTC(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
            const d2 = Date.UTC(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());

            const diffDays = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
            const cycleDay = ((diffDays % 6) + 6) % 6;

            if (cycleDay === 0 || cycleDay === 1) return { label: 'M', color: 'bg-yellow-50 text-yellow-700 border-yellow-200' };
            if (cycleDay === 2 || cycleDay === 3) return { label: 'N', color: 'bg-indigo-50 text-indigo-700 border-indigo-200' };
            if (cycleDay === 4 || cycleDay === 5) return { label: 'OFF', color: 'bg-gray-100 text-gray-400 border-gray-200 opacity-60' };
        }

        // ── RENDER ──
        function renderCalendar() {
            const { startDate, endDate } = getVoucherPeriod(periodOffset);
            updateDashboardHeader(startDate, endDate);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const gridContainer = document.getElementById('calendar-grid');
            gridContainer.innerHTML = '';

            // Weekday header row
            for (let i = 0; i < 7; i++) {
                const header = document.createElement('div');
                header.className = 'text-center text-[0.65rem] font-bold text-gray-400 uppercase tracking-wider pb-1';
                header.innerText = WEEKDAY_LABELS[i];
                gridContainer.appendChild(header);
            }

            // Offset empty cells so the 1st day aligns with its weekday column
            const startDow = startDate.getDay();
            for (let i = 0; i < startDow; i++) {
                const empty = document.createElement('div');
                gridContainer.appendChild(empty);
            }

            let currentDate = new Date(startDate);
            let presentCount = 0;
            let missedCount = 0;
            let offCount = 0;

            while (currentDate <= endDate) {
                const dayOfMonth = currentDate.getDate();
                const y = currentDate.getFullYear();
                const m = String(currentDate.getMonth() + 1).padStart(2, '0');
                const d = String(currentDate.getDate()).padStart(2, '0');
                const fullDateString = `${y}-${m}-${d}`;

                const shiftInfo = getShiftInfo(currentDate);
                const isFuture = currentDate > today;

                const dayEl = document.createElement('button');
                let classes = 'aspect-square flex flex-col items-center justify-center rounded-xl border transition font-bold text-lg sm:text-xl relative overflow-hidden';
                let inner = '';

                if (!shiftInfo) {
                    classes += ' bg-white border-gray-200 shadow-sm';
                    inner = String(dayOfMonth);
                    dayEl.onclick = null;
                } else if (isFuture) {
                    classes += ' border-gray-100 text-gray-300 bg-gray-50/50 shadow-none cursor-default';
                    inner = `<span class="text-gray-300">${dayOfMonth}</span>`;
                    if (shiftInfo.label !== 'OFF') {
                        inner += `<span class="text-[0.5rem] font-bold uppercase tracking-widest mt-0.5 text-gray-300">${shiftInfo.label}</span>`;
                    } else {
                        inner += `<span class="text-[0.5rem] font-bold uppercase tracking-widest mt-0.5 text-gray-300">OFF</span>`;
                    }
                    dayEl.onclick = null;
                } else {
                    const isMissed = missedDays.includes(fullDateString);

                    if (shiftInfo.label === 'OFF') {
                        offCount++;
                        classes += ` ${shiftInfo.color}`;
                        inner = `<span>${dayOfMonth}</span><span class="text-[0.6rem] font-bold uppercase tracking-widest mt-1 opacity-80">OFF</span>`;
                    } else if (isMissed) {
                        missedCount++;
                        classes += ' bg-red-500 text-white border-red-600 scale-95 shadow-md';
                        inner = `<span>${dayOfMonth}</span><span class="text-[0.55rem] font-bold uppercase tracking-widest mt-1 opacity-90">MISSED</span>`;
                    } else {
                        presentCount++;
                        classes += ` ${shiftInfo.color} hover:shadow-md`;
                        inner = `<span>${dayOfMonth}</span><span class="text-[0.6rem] font-bold uppercase tracking-widest mt-1 opacity-80">${shiftInfo.label}</span>`;
                    }

                    dayEl.onclick = function () {
                        if (isSettingCycle) {
                            localStorage.setItem('anchorDate', fullDateString);
                            savedAnchorDate = fullDateString;
                            isSettingCycle = false;
                            document.getElementById('set-cycle-btn').innerText = 'Change Cycle Start';
                            document.getElementById('set-cycle-btn').classList.remove('animate-pulse', 'bg-red-100', 'text-red-600');
                            renderCalendar();
                        } else {
                            if (shiftInfo.label === 'OFF') return;

                            if (missedDays.includes(fullDateString)) {
                                missedDays = missedDays.filter(day => day !== fullDateString);
                            } else {
                                missedDays.push(fullDateString);
                            }
                            localStorage.setItem('missedDays', JSON.stringify(missedDays));
                            renderCalendar();
                        }
                    };
                }

                dayEl.className = classes;
                dayEl.innerHTML = inner;
                gridContainer.appendChild(dayEl);

                currentDate.setDate(currentDate.getDate() + 1);
            }

            // Update dashboard counters
            if (savedAnchorDate) {
                document.getElementById('days-present-count').innerText = presentCount;
                document.getElementById('days-missed-count').innerText = missedCount;
                document.getElementById('days-off-count').innerText = offCount;
            } else {
                document.getElementById('days-present-count').innerText = '--';
                document.getElementById('days-missed-count').innerText = '--';
                document.getElementById('days-off-count').innerText = '--';
            }

            // Reset cycle-setting state on any render (e.g. after period nav)
            if (isSettingCycle) {
                isSettingCycle = false;
                const btn = document.getElementById('set-cycle-btn');
                btn.innerText = savedAnchorDate ? 'Change Cycle Start' : 'Set Cycle Start';
                btn.classList.remove('animate-pulse', 'bg-red-100', 'text-red-600');
            }
        }

        // ── EXPORT ──
        function exportData() {
            const data = {
                anchorDate: savedAnchorDate || '',
                missedDays: missedDays,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voucher-data-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ── IMPORT ──
        function importData(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.anchorDate === undefined || data.missedDays === undefined) {
                        alert('Invalid file format. Missing required fields.');
                        return;
                    }
                    if (data.anchorDate && !/^\d{4}-\d{2}-\d{2}$/.test(data.anchorDate)) {
                        alert('Invalid date format in import file.');
                        return;
                    }
                    if (!Array.isArray(data.missedDays)) {
                        alert('Invalid missedDays format in import file.');
                        return;
                    }
                    savedAnchorDate = data.anchorDate || null;
                    missedDays = data.missedDays;
                    localStorage.setItem('anchorDate', savedAnchorDate || '');
                    localStorage.setItem('missedDays', JSON.stringify(missedDays));
                    const btn = document.getElementById('set-cycle-btn');
                    btn.innerText = savedAnchorDate ? 'Change Cycle Start' : 'Set Cycle Start';
                    btn.classList.remove('animate-pulse', 'bg-red-100', 'text-red-600');
                    isSettingCycle = false;
                    periodOffset = 0;
                    renderCalendar();
                    alert('Data imported successfully!');
                } catch {
                    alert('Invalid JSON file.');
                }
            };
            reader.readAsText(file);
        }

        // ── RESET ──
        function resetData() {
            if (confirm('Are you sure you want to reset ALL data? This cannot be undone.')) {
                localStorage.removeItem('anchorDate');
                localStorage.removeItem('missedDays');
                savedAnchorDate = null;
                missedDays = [];
                periodOffset = 0;
                isSettingCycle = false;
                const btn = document.getElementById('set-cycle-btn');
                btn.innerText = 'Set Cycle Start';
                btn.classList.remove('animate-pulse', 'bg-red-100', 'text-red-600');
                renderCalendar();
            }
        }

        // ── EVENT WIRING ──
        document.getElementById('set-cycle-btn').onclick = function () {
            isSettingCycle = true;
            this.innerText = 'Select Day Below...';
            this.classList.add('animate-pulse', 'bg-red-100', 'text-red-600');
        };

        document.getElementById('prev-period-btn').onclick = function () {
            periodOffset -= 1;
            renderCalendar();
        };

        document.getElementById('next-period-btn').onclick = function () {
            periodOffset += 1;
            renderCalendar();
        };

        document.getElementById('export-btn').onclick = exportData;

        document.getElementById('import-btn').onclick = function () {
            document.getElementById('import-file-input').click();
        };

        document.getElementById('import-file-input').onchange = function (e) {
            if (e.target.files.length > 0) {
                importData(e.target.files[0]);
                e.target.value = '';
            }
        };

        document.getElementById('reset-btn').onclick = resetData;

        // ── INIT ──
        if (savedAnchorDate) {
            document.getElementById('set-cycle-btn').innerText = 'Change Cycle Start';
        }
        renderCalendar();
    </script>
</body>
</html>
